# SwiftLint configuration for SoundOwl.
excluded:
  - .build
  - DerivedData
  - build
  - tools

disabled_rules:
  - todo
  - line_length          # governed by SwiftFormat --maxwidth

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init

# Signal-processing code reads best with the names its formulas use: x, y, n, k, c.
identifier_name:
  min_length: 1

# The model manifest mirrors model.json, which nests three levels.
nesting:
  type_level: 3

# DSP kernels take their buffers explicitly rather than through a context type.
function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 20
  error: 40
  ignores_case_statements: true

file_length:
  warning: 650
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 130
  error: 300

type_body_length:
  warning: 525
  error: 700
